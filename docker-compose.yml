version: '3.8'

services:
  database:
    image: mongo:latest
    container_name: ems-database
    ports:
      - "27017:27017"
    volumes:
      - ems-db-data:/data/db

  backend:
    build: ./backend
    container_name: ems-backend-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://database:27017/ems
      - JWT_SECRET=supersecretkeyforemployeemanagement
      - NODE_ENV=production
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: ems-frontend-client
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  ems-db-data:
